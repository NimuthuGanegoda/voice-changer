name: Build Windows EXE

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Build Frontend
        run: |
          cd client/demo
          npm ci
          npx webpack --config webpack.prod.js

      - name: Install Server Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller VoiceChanger.spec --noconfirm

      - name: Resolve installer version
        id: version
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $parts = ($tag -split '\.') + @('0', '0', '0', '0')
          $version = ($parts[0..3] -join '.')
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { $version = "0.0.0.0" }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: |
          makensis "-DVERSION=${{ steps.version.outputs.version }}" installer\VoiceChanger.nsi

      - name: Release (tagged version)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/VoiceChanger.exe
            dist/VoiceChangerSetup.exe

      - name: Release (rolling build from master)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: latest-build
          name: "Latest build (auto, unstable)"
          body: |
            Automatic build from the latest push to master (commit ${{ github.sha }}).
            This is not a stable/versioned release - it's overwritten on every push.
            For a stable version, use a tagged release instead.
          prerelease: true
          files: |
            dist/VoiceChanger.exe
            dist/VoiceChangerSetup.exe
