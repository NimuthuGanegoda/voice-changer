name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:client

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: python -m pip install -r server/requirements-dev.txt
      - run: python -m pytest server/tests -q
      - name: Shell syntax
        run: bash -n start_local.sh start_docker.sh server/initialize.sh docker_vcclient/setup.sh docker_vcclient/exec.sh

  runtime-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1 portaudio19-dev
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pip install -r server/requirements-dev.txt
      - name: Clean-install import smoke test
        working-directory: server
        run: python -c "import MMVCServerSIO; print('runtime imports OK')"
      - name: Runtime-backed regression tests
        run: python -m pytest server/tests -q

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build image from this checkout
        run: docker build -f docker_vcclient/Dockerfile -t voice-changer:ci .
      - name: HTTP and authorization smoke test
        run: |
          docker run -d --name vc-smoke -e VCCLIENT_ACCESS_TOKEN=ci-smoke-token-123456 \
            -p 127.0.0.1:18888:18888 voice-changer:ci \
            -p 18888 --host 0.0.0.0 --https false --no_download
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18888/api/hello; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:18888/api/hello
          curl -fsS http://127.0.0.1:18888/api/health
          curl -fsS http://127.0.0.1:18888/ | grep -qi '<html'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18888/info)" = 401
          curl -fsS -H 'Authorization: Bearer ci-smoke-token-123456' http://127.0.0.1:18888/info > /tmp/info.json
          python -c "import json; d=json.load(open('/tmp/info.json')); assert d['status']=='OK'; assert isinstance(d['sampleModels'], list)"
          curl -fsS -X POST -H 'Authorization: Bearer ci-smoke-token-123456' http://127.0.0.1:18888/soundboard/stop
      - if: failure()
        run: docker logs vc-smoke
      - if: always()
        run: docker rm -f vc-smoke || true
